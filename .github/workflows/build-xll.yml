name: build-xll

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-xll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and Build (Ninja + MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 定位 VS 安装路径（GitHub windows-latest 自带 VS2022 + C++ 工作负载 + Windows SDK）
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Write-Host "VS path: $vsPath"
          # 载入 MSVC + Windows SDK 开发环境（cl/link/rc 及头文件/库路径随 DevShell 注入）
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -Arch amd64 -HostArch amd64
          cmake -S xll -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify artifact
        shell: pwsh
        run: Get-ChildItem build\DeviceLogin.xll | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DeviceLogin-xll
          path: build/DeviceLogin.xll
