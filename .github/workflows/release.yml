name: release

# 打 tag（v*）即自动重编所有平台产物并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- XLL（Windows）----------
  build-xll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and Build (Ninja + MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Write-Host "VS path: $vsPath"
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -Arch amd64 -HostArch amd64
          cmake -S xll -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceLogin-xll
          path: build/DeviceLogin.xll

  # ---------- Android APK ----------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: mobile_app
        run: |
          flutter create --platforms=android,ios . || true
          flutter pub get
          python3 ../ci/patch_redirect.py
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mobile_app-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  # ---------- iOS（未签名 .app，打包为 zip）----------
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build iOS (unsigned) and package as IPA
        working-directory: mobile_app
        run: |
          flutter create --platforms=android,ios . || true
          flutter pub get
          python3 ../ci/patch_redirect.py
          flutter build ios --release --no-codesign
          # IPA = zip 内含 Payload/<app>.app；仅改后缀不行，必须包一层 Payload
          mkdir -p Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r "$GITHUB_WORKSPACE/ios-app.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mobile_app-ios-ipa
          path: ${{ github.workspace }}/ios-app.ipa

  # ---------- 桌面端（Win/Mac/Linux）----------
  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev pkg-config
      - name: Build desktop
        working-directory: desktop_login
        run: |
          flutter create --platforms=windows,macos,linux . || true
          flutter pub get
          flutter build ${{ matrix.platform }} --release
      - name: Package windows
        if: matrix.platform == 'windows'
        working-directory: desktop_login
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $env:GITHUB_WORKSPACE/windows-release.zip
      - name: Package macos
        if: matrix.platform == 'macos'
        working-directory: desktop_login
        run: zip -r "$GITHUB_WORKSPACE/macos-release.zip" build/macos/Build/Products/Release/*.app
      - name: Package linux
        if: matrix.platform == 'linux'
        working-directory: desktop_login
        run: zip -r "$GITHUB_WORKSPACE/linux-release.zip" build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: desktop_login-${{ matrix.platform }}
          path: ${{ github.workspace }}/${{ matrix.platform }}-release.zip

  # ---------- 汇总并发布到 Release ----------
  release:
    needs: [build-xll, build-android, build-ios, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: find artifacts -type f
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
